<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Guess Guess Guess</title>

  <link rel="stylesheet" href="style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>


<body>
  <div id="game-root">
    <h1>Guess Guess Guess</h1>

    <!-- ADMIN PANEL (temporary) -->
    <section id="adminPanel" class="hidden" style="max-width: 900px; margin: 12px auto; padding: 8px;">
      <div style="display:flex; gap:8px; align-items:flex-start; justify-content:center; flex-wrap:wrap;">
           
 
        <textarea
          id="adminText"
          rows="2"
          placeholder="ADMIN: type a puzzle here (words separated by spaces)..."
          style="width: min(820px, 92vw); font-size: 16px; padding: 8px;"
        ></textarea>

        <button
          id="loadPuzzleBtn"
          style="font-size: 16px; padding: 10px 14px; cursor: pointer;"
          type="button"
        >
          Load Puzzle
        </button>
        <div style="margin-top: 8px; font-size: 14px;">
  <div style="font-weight: 600; margin-bottom: 4px;">Optional puzzle image</div>
  <input id="adminImageInput" type="file" accept="image/*">
</div>

      </div>
    </section>

    <!-- PUZZLE RENDER AREA -->
    <section id="puzzleArea"></section>

    <!-- CONTROLS -->
    <div id="controls">
      <div id="statsRow">
        <div id="strikeDisplay">Strikes: 0</div>
        <div id="scoreDisplay">Score: 0</div>
      </div>

      <div id="message"></div>

      <!-- WIN BANNER (anchored under strike counter) -->
      <div id="winBanner" class="hidden" role="status" aria-live="polite">
        <img id="endingImage" alt="">
      </div>
    </div>

<div id="imageOverlay" style="display:none;" aria-hidden="true">
  <img id="puzzleImage" alt="Puzzle image">
</div>

    <!-- PLAYER BUTTONS -->
<div id="playerButtonRow">
  <div id="holdImageArea">
    <button id="holdImageBtn" type="button" style="display:none;">
      Hold to View Image
    </button>
  </div>

  <div id="endGameArea">
  <button
    id="endGameBtn"
    type="button"
  >
    Show Answer
  </button>
  </div>

  <button
    id="nextPuzzleBtn"
    type="button"
  >
    Next Puzzle
  </button>
</div>
  </div>

  <script src="hints.js"></script>
  <script src="game.js"></script>
</body>
</html>
